name: Update fresh data (cloud)

# Denní kontrola NOVÝCH zakázek BEZ zapnutého PC (pokyn 31. 7. 2026).
# Běží na GitHub-hosted runneru: profily zadavatelů, PVU RSS, NEN,
# dokumenty i AI filtr jsou z cloudu dostupné (ověřeno sondou).
# ISVZ blokuje mimoevropské IP ⇒ SKIP_ISVZ=1, jeho záznamy drží retence
# a doplní je self-hosted běh, kdykoli je PC zapnuté (stačí párkrát
# do měsíce — ISVZ exporty vycházejí 1.–5. dne). Registr smluv (také
# EU-only) zůstává na self-hosted workflow Update registr smluv.

on:
  schedule:
    - cron: "0 6 * * *"   # 8:00 Praha v létě (CEST)
    - cron: "0 7 * * *"   # 8:00 Praha v zimě (CET)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data-cloud   # vlastní skupina — nesmí se řadit za
  cancel-in-progress: false  # frontu self-hosted běhů čekajících na PC

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Guard – jen sezónní cron
        if: github.event_name == 'schedule'
        run: |
          offset=$(TZ=Europe/Prague date +%z)
          want="0 6 * * *"; [ "$offset" = "+0100" ] && want="0 7 * * *"
          if [ "${{ github.event.schedule }}" != "$want" ]; then
            echo "Cron neni sezonni - koncim."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - name: Install deps
        if: env.SKIP != '1'
        run: python -m pip install -q -r scraper/requirements.txt

      - name: Run scraper (bez ISVZ)
        if: env.SKIP != '1'
        env:
          SKIP_ISVZ: "1"
        run: python -X utf8 scraper/main.py

      - name: Read documents (ZD + písemné zprávy)
        if: env.SKIP != '1'
        continue-on-error: true
        run: python -X utf8 scraper/fetch_dokumenty.py

      - name: AI filtr relevance (Claude)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -X utf8 scraper/fetch_ai.py

      - name: Commit data
        if: env.SKIP != '1'
        run: |
          git config user.name "domistav-tendry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +%F) (cloud)"
            git pull --rebase -X theirs origin main
            git push || { git pull --rebase -X theirs origin main; git push; }
          else
            echo "Beze zmen."
          fi
