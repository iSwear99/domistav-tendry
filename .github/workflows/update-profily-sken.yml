name: Sken profilů v okruhu

# Týdenní sken VŠECH profilů zadavatelů v okruhu 50 km (pokyn 19. 10.
# 2026) — VZMR nekonfigurovaných zadavatelů mimo systémy agregované
# v ISVZ. Katalog ~580 profilů se buduje automaticky z archivu.
#
# Cron je DENNÍ, ale hlídka pustí běh jen když od posledního skenu
# uplynulo ≥ 6 dní (docs/data/sken_meta.json). Fronta GitHubu drží běh
# až 24 h a runner startuje s přihlášením ⇒ sken reálně proběhne
# OKAMŽIKEM PRVNÍHO ZAPNUTÍ PC v daném týdnu. Hodina crontu je proto
# nepodstatná — sezónní guard tu není potřeba.

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profily-sken
  cancel-in-progress: false

jobs:
  sken:
    runs-on: self-hosted
    defaults:
      run:
        # Bypass kvůli resetu ExecutionPolicy Windows updatem — viz
        # update-data.yml; jen pro tyto kroky, systém se nemění.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Hlídka – sken max. 1× za 6 dní
        run: |
          $skip = python -X utf8 -c "import json,datetime,os; p='docs/data/sken_meta.json'; m=json.load(open(p,encoding='utf-8')) if os.path.exists(p) else {'updated':'2000-01-01'}; print(1 if (datetime.date.today()-datetime.date.fromisoformat(m['updated'][:10])).days<6 else 0)"
          if ($skip.Trim() -eq "1") {
            Write-Host "Posledni sken je cerstvy - koncim."
            "SKIP=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Install deps
        if: env.SKIP != '1'
        run: python -m pip install -q -r scraper/requirements.txt

      - name: Run scraper se skenem profilů
        if: env.SKIP != '1'
        env:
          SKEN_PROFILU: "1"
        run: python -X utf8 scraper/main.py

      - name: AI filtr relevance (Claude)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -X utf8 scraper/fetch_ai.py

      - name: Commit data
        if: env.SKIP != '1'
        run: |
          git config user.name "domistav-tendry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $d = [DateTime]::UtcNow.ToString("yyyy-MM-dd")
            git commit -m "data: sken profilu $d"
            git pull --rebase -X theirs origin main
            git push
            if ($LASTEXITCODE -ne 0) {
              git pull --rebase -X theirs origin main
              git push
            }
          } else {
            Write-Host "Beze zmen."
          }
