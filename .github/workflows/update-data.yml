name: Update tender data

on:
  schedule:
    - cron: "0 6 * * *"   # 8:00 Praha v létě (CEST, UTC+2)
    - cron: "0 7 * * *"   # 8:00 Praha v zimě (CET, UTC+1)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Guard – běžet jen v 8:00 pražského času
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=Europe/Prague date +%H)
          if [ "$HOUR" != "08" ]; then
            echo "Pražský čas ${HOUR}h ≠ 8h — druhý cron, končím."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: Install deps
        if: env.SKIP != '1'
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        if: env.SKIP != '1'
        env:
          NEN_CERT_PEM: ${{ secrets.NEN_CERT_PEM }}
          NEN_KEY_PEM: ${{ secrets.NEN_KEY_PEM }}
        run: python scraper/main.py

      - name: Commit data
        if: env.SKIP != '1'
        run: |
          git config user.name "domistav-tendry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "Beze změn."
          else
            git commit -m "data: $(date -u +%F)"
            # mezitím mohl přibýt commit (kód) — rebase, data soubory jsou naše
            git pull --rebase origin main
            git push
          fi
