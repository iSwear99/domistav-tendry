name: Update tender data

on:
  schedule:
    - cron: "0 6 * * *"   # 8:00 Praha v létě (CEST, UTC+2)
    - cron: "0 7 * * *"   # 8:00 Praha v zimě (CET, UTC+1)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # Self-hosted runner na PC v ČR — isvz.nipez.cz blokuje mimoevropské
    # IP adresy (GitHub-hosted runnery v USA se k němu nepřipojí).
    # Je-li PC vypnuté, běh čeká ve frontě až 24 h a pak propadne —
    # data doplní další denní běh. Kroky jsou v PowerShellu (Windows).
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      # Dva crony (6:00 a 7:00 UTC) kryjí letní/zimní čas. Rozhoduje se
      # podle toho, KTERÝ cron běh vyvolal — ne podle aktuální hodiny:
      # při vypnutém PC běh čeká ve frontě a spustí se opožděně, dřívější
      # kontrola „je právě 8 h?" pak celé dny tiše přeskakovala
      # (zjištěno 31. 7. 2026 — data stála od 29. 7.).
      - name: Guard – jen sezónní cron (odolný vůči frontě)
        if: github.event_name == 'schedule'
        run: |
          $offset = [System.TimeZoneInfo]::FindSystemTimeZoneById("Central Europe Standard Time").GetUtcOffset([DateTime]::UtcNow).TotalHours
          $want = if ($offset -eq 2) { "0 6 * * *" } else { "0 7 * * *" }
          $cron = "${{ github.event.schedule }}"
          if ($cron -ne $want) {
            Write-Host "Cron '$cron' neni sezonni ('$want') - koncim."
            "SKIP=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - name: Install deps
        if: env.SKIP != '1'
        run: python -m pip install -q -r scraper/requirements.txt

      - name: Run scraper
        if: env.SKIP != '1'
        env:
          NEN_CERT_PEM: ${{ secrets.NEN_CERT_PEM }}
          NEN_KEY_PEM: ${{ secrets.NEN_KEY_PEM }}
        run: python -X utf8 scraper/main.py

      - name: Read documents (ZD + písemné zprávy)
        if: env.SKIP != '1'
        continue-on-error: true   # čtení dokumentů nesmí shodit denní data
        run: python -X utf8 scraper/fetch_dokumenty.py

      - name: AI filtr relevance (Claude)
        if: env.SKIP != '1'
        continue-on-error: true   # bez klíče/kreditu se tiše přeskočí
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -X utf8 scraper/fetch_ai.py

      - name: Commit data
        if: env.SKIP != '1'
        run: |
          git config user.name "domistav-tendry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $d = [DateTime]::UtcNow.ToString("yyyy-MM-dd")
            git commit -m "data: $d"
            # mezitím mohl přibýt commit — rebase; při konfliktu v datových
            # souborech vyhrává čerstvý běh (-X theirs = náš datový commit)
            git pull --rebase -X theirs origin main
            git push
            if ($LASTEXITCODE -ne 0) {
              git pull --rebase -X theirs origin main
              git push
            }
          } else {
            Write-Host "Beze zmen."
          }
