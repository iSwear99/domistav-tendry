name: Update registr smluv

on:
  schedule:
    - cron: "40 5 7 * *"   # měsíčně 7. den (po publikaci ISVZ i dumpů)
    - cron: "40 5 * * 1"   # týdenní pojistka: zajistí auto-backfill
                           # do 7 dnů od naplnění Konkurence + čerstvé dodatky
  workflow_dispatch:        # nouzovka — provoz je plně automatický

permissions:
  contents: write

concurrency:
  group: update-smlouvy
  cancel-in-progress: false

jobs:
  smlouvy:
    # Self-hosted runner (ČR) — stejná infrastruktura jako Update tender
    # data. Skript sám rozhodne: prázdná Konkurence => klidný exit 0;
    # prázdné smlouvy.json => backfill 13 měsíců; jinak přírůstek.
    runs-on: self-hosted
    defaults:
      run:
        # Bypass kvůli resetu ExecutionPolicy Windows updatem — viz
        # update-data.yml; jen pro tyto kroky, systém se nemění.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      # zaseknutý rebase z dřívějška by blokoval commit — viz update-data.yml
      - name: Úklid gitu
        run: python scraper/commit_data.py --uklid

      - name: Run fetch_smlouvy
        env:
          # týž fine-grained PAT (scope gist) jako v UI ⇅ — čtení
          # watchlistu pro párování oblíbených; bez něj se přeskočí
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python -X utf8 scraper/fetch_smlouvy.py

      - name: Commit smlouvy.json
        run: |
          $d = [DateTime]::UtcNow.ToString("yyyy-MM-dd")
          python -X utf8 scraper/commit_data.py "data: registr smluv $d" docs/data/smlouvy.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
