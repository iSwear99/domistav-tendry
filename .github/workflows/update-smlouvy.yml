name: Update registr smluv

on:
  schedule:
    - cron: "40 5 7 * *"   # měsíčně 7. den (po publikaci ISVZ i dumpů)
    - cron: "40 5 * * 1"   # týdenní pojistka: zajistí auto-backfill
                           # do 7 dnů od naplnění Konkurence + čerstvé dodatky
  workflow_dispatch:        # nouzovka — provoz je plně automatický

permissions:
  contents: write

concurrency:
  group: update-smlouvy
  cancel-in-progress: false

jobs:
  smlouvy:
    # Self-hosted runner (ČR) — stejná infrastruktura jako Update tender
    # data. Skript sám rozhodne: prázdná Konkurence => klidný exit 0;
    # prázdné smlouvy.json => backfill 13 měsíců; jinak přírůstek.
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Run fetch_smlouvy
        run: python -X utf8 scraper/fetch_smlouvy.py

      - name: Commit smlouvy.json
        run: |
          git config user.name "domistav-tendry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/smlouvy.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $d = [DateTime]::UtcNow.ToString("yyyy-MM-dd")
            git commit -m "data: registr smluv $d"
            git pull --rebase origin main
            git push
          } else {
            Write-Host "Beze zmen."
          }
